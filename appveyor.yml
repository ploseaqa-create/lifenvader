# Windows build on AppVeyor -- free for public repositories, and unlike
# GitHub Actions it needs no payment method on the account.
# Connect the repo at https://ci.appveyor.com/projects/new

version: 1.0.{build}
image: Visual Studio 2022
configuration: Release
platform: x64
clone_depth: 1

build_script:
  - cmd: cmake -B build -S . -A x64
  - cmd: cmake --build build --config Release

after_build:
  - ps: |
      $exe = "build/Release/lifenvader.exe"
      if (-not (Test-Path $exe)) { throw "lifenvader.exe was not produced" }

      # The interface is embedded, so the .exe must be self-contained. A build
      # that lost the resources would still link but show an empty window, so
      # check the binary actually carries them.
      $size = (Get-Item $exe).Length
      Write-Host "lifenvader.exe: $size bytes"
      if ($size -lt 1MB) {
          throw "lifenvader.exe is only $size bytes - the embedded UI is missing"
      }
      Copy-Item $exe .

artifacts:
  - path: lifenvader.exe
    name: lifenvader
